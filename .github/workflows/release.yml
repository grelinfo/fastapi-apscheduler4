name: Release
on:
  release:
    types:
      - published
permissions:
  contents: read
env:
  UV_FROZEN: 1
jobs:
  publish-package:
    name: Publish Package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Set Package Version
      env:
        TAG_NAME: ${{ github.event.release.tag_name }}
      run: |
        # Remove 'v' prefix if present
        VERSION=${TAG_NAME#v}
        # Update version in pyproject.toml
        sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
        echo "Updated version to $VERSION"
        grep "^version" pyproject.toml
    - name: Build Package
      run: uv build
    - name: Publish Package
      uses: pypa/gh-action-pypi-publish@release/v1
  publish-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Configure Git
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
    - name: Fetch and merge remote gh-pages
      run: |
        git fetch origin gh-pages:gh-pages || true
        git checkout gh-pages || git checkout --orphan gh-pages
        git pull origin gh-pages || true
        git checkout ${{ github.ref_name }}
    - name: Install uv and Activate Environment
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        activate-environment: true
    - name: Install Dependencies
      run: uv sync
    - name: Get Version
      id: get-version
      env:
        TAG_NAME: ${{ github.event.release.tag_name }}
      run: |
        # Remove 'v' prefix if present, then keep only MAJOR.MINOR for the docs version
        VERSION=${TAG_NAME#v}
        MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
        echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"
        echo "Docs version: $MAJOR_MINOR"
    - name: Publish Docs
      env:
        MAJOR_MINOR: ${{ steps.get-version.outputs.major_minor }}
      run: mike deploy --push --update-aliases "$MAJOR_MINOR" latest
